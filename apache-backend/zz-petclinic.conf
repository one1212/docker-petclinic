# Apache → Tomcat 리버스 프록시 + 관리자 접근 제어
# TOMCAT_HOST / TOMCAT_PORT / ADMIN_PATH 는 컨테이너 환경변수에서 읽음

ProxyRequests Off
ProxyPreserveHost On
ProxyTimeout 60

# Spring PetClinic 원래 화면(/petclinic/: 보호자 · 반려동물 · 방문 · 수의사)은 쓰지 않음
#   → 프록시하지 않으므로 밖에서는 404. (WAS 안에는 남아 있지만 WEB 을 거쳐서는 들어갈 수 없음)
# 보호자 · 수의사 JSON API 도 쓰지 않음: 프록시에서 빼고(!) 404 로 응답
#   (ProxyPass 는 위에서부터 먼저 맞는 것을 쓰므로 제외 규칙을 /api/ 보다 앞에 둠)
ProxyPassMatch "^/api/(owners|vets)(/.*)?$" !
RedirectMatch 404 "^/api/(owners|vets)(/.*)?$"

# 미용 예약 API: /api/... → Tomcat /petclinic/api/...
ProxyPass        /api/       http://${TOMCAT_HOST}:${TOMCAT_PORT}/petclinic/api/
ProxyPassReverse /api/       http://${TOMCAT_HOST}:${TOMCAT_PORT}/petclinic/api/

# =====================================================================
# 관리자 화면: ADMIN_PATH (예: /staff-room) → /var/www/admin
#   사용자 화면 어디에도 이 주소로 가는 링크를 두지 않음
# =====================================================================
Alias "${ADMIN_PATH}" "/var/www/admin"
<Directory "/var/www/admin">
    Options None
    AllowOverride None
    DirectoryIndex index.html
    Require all granted
</Directory>

# =====================================================================
# 관리자 인증 (HTTP Basic)
#   - 비밀번호 파일은 컨테이너 시작 때 ADMIN_USER / ADMIN_PASSWORD 로 만듦 (docker-entrypoint.sh)
#   - 값이 없으면 빈 파일 → 아무도 통과 못 함 (관리자 경로 전부 401)
#   - 세션을 쓰지 않음: 브라우저가 요청마다 인증 정보를 보내므로 WAS Pod 가 여러 개여도 로그인 유지
#   - 아래 <Location> 들은 위에서부터 차례로 적용되고, 뒤에 나온 Require 가 앞의 것을 덮어씀
# =====================================================================

# 1) 관리자 화면
<Location "${ADMIN_PATH}">
    AuthType Basic
    AuthName "Durup Salon Admin"
    AuthBasicProvider file
    AuthUserFile /etc/apache2/admin/htpasswd
    Require valid-user
</Location>

# 2) API 는 기본적으로 관리자만 (전체 예약 목록 · 상세 · 달력 등)
<Location "/api/">
    AuthType Basic
    AuthName "Durup Salon Admin"
    AuthBasicProvider file
    AuthUserFile /etc/apache2/admin/htpasswd
    Require valid-user
</Location>

# 3) 사용자 화면에서 쓰는 API 만 공개: 상태 확인, 남은 자리, 본인 예약 조회(POST)
<LocationMatch "^/api/(health|grooming/bookings/availability|grooming/bookings/lookup)$">
    Require all granted
</LocationMatch>

# 4) /api/grooming/bookings : 예약 등록(POST)은 누구나, 목록 조회(GET)는 관리자만
<LocationMatch "^/api/grooming/bookings/?$">
    <RequireAny>
        Require method POST
        Require valid-user
    </RequireAny>
</LocationMatch>
