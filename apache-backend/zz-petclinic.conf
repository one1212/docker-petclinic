# Apache → Tomcat 리버스 프록시 + 관리자 접근 제어
# TOMCAT_HOST / TOMCAT_PORT / ADMIN_PATH 는 컨테이너 환경변수에서 읽음
#
# 원칙: WAS 로 넘기는 주소를 "허용 목록"으로만 둔다.
#   - 목록에 없는 주소(/petclinic/..., /api/owners, /api/vets, /api/..;/... 같은 우회 경로 포함)는
#     WAS 로 가지 않고 WEB 에서 404.
#   - 정규식은 ^...$ 로 끝까지 맞춰야 해서 ';' · '..' 같은 꼬리가 붙은 경로는 통과하지 못함.

ProxyRequests Off
ProxyPreserveHost On
ProxyTimeout 60

# =====================================================================
# 1) 사용자 화면용 공개 API (로그인 없음)
#    /api/health, /api/grooming/bookings(POST 예약 등록),
#    /api/grooming/bookings/availability, /api/grooming/bookings/lookup
# =====================================================================
ProxyPassMatch "^/api/(health|grooming/bookings|grooming/bookings/availability|grooming/bookings/lookup)$" "http://${TOMCAT_HOST}:${TOMCAT_PORT}/petclinic/api/$1"

# 예약 목록(GET /api/grooming/bookings)은 공개하지 않음: 이 주소는 예약 등록(POST)만 허용
<LocationMatch "^/api/grooming/bookings$">
    <LimitExcept POST>
        Require all denied
    </LimitExcept>
</LocationMatch>

# =====================================================================
# 2) 관리자 화면: ADMIN_PATH (예: /staff-room) → /var/www/admin
#    관리자용 API 도 같은 경로 아래(ADMIN_PATH/api/...)에 둠
#    → 브라우저가 관리자 화면에 로그인한 인증 정보를 이 API 호출에도 그대로 보냄
# =====================================================================
ProxyPassMatch "^${ADMIN_PATH}/api/(grooming/bookings|grooming/bookings/[0-9]+|grooming/bookings/calendar)$" "http://${TOMCAT_HOST}:${TOMCAT_PORT}/petclinic/api/$1"

Alias "${ADMIN_PATH}" "/var/www/admin"
<Directory "/var/www/admin">
    Options None
    AllowOverride None
    DirectoryIndex index.html
    Require all granted
</Directory>

# 관리자 인증 (HTTP Basic)
#   - 비밀번호 파일은 컨테이너 시작 때 ADMIN_USER / ADMIN_PASSWORD 로 만듦 (docker-entrypoint.sh)
#   - 값이 없으면 빈 파일 → 아무도 통과 못 함 (관리자 경로 전부 401)
#   - 세션을 쓰지 않음: 브라우저가 요청마다 인증 정보를 보내므로 WAS Pod 가 여러 개여도 로그인 유지
<Location "${ADMIN_PATH}">
    AuthType Basic
    AuthName "Durup Salon Admin"
    AuthBasicProvider file
    AuthUserFile /etc/apache2/admin/htpasswd
    Require valid-user
</Location>
