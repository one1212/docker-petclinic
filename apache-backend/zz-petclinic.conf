# Apache → Tomcat 리버스 프록시
# TOMCAT_HOST / TOMCAT_PORT 는 컨테이너 환경변수에서 읽음

ProxyRequests Off
ProxyPreserveHost On
ProxyTimeout 60

# 미용 예약 API: /api/... → Tomcat /petclinic/api/...
ProxyPass        /api/       http://${TOMCAT_HOST}:${TOMCAT_PORT}/petclinic/api/
ProxyPassReverse /api/       http://${TOMCAT_HOST}:${TOMCAT_PORT}/petclinic/api/

# Petclinic 본 화면: /petclinic/... → Tomcat /petclinic/...
ProxyPass        /petclinic/ http://${TOMCAT_HOST}:${TOMCAT_PORT}/petclinic/
ProxyPassReverse /petclinic/ http://${TOMCAT_HOST}:${TOMCAT_PORT}/petclinic/
