<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f4ee">
  <title>두룹 살롱 | 미용 체험 게임</title>
  <style>
    :root{--ink:#26352d;--muted:#718078;--green:#315c48;--mint:#e6efe8;--cream:#f6f4ee;--line:#e4e7df;--orange:#e89055;--red:#b8473f}
    *{box-sizing:border-box}
    body{margin:0;background:var(--cream);color:var(--ink);font-family:Arial,"Malgun Gothic",sans-serif;line-height:1.5}
    .emoji{font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
    .top{padding:16px max(20px,calc((100% - 1120px)/2));display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);background:#fff}
    .brand{font-weight:800;font-size:20px;color:var(--green)}.brand span{color:var(--orange)}
    .back{color:var(--green);text-decoration:none;font-weight:700;font-size:14px}
    .top-links{display:flex;align-items:center;gap:14px}
    .yt{display:inline-flex;align-items:center;gap:6px;text-decoration:none;color:var(--ink);font-size:13px;font-weight:700;padding:4px 8px;border-radius:10px;border:1px solid var(--line);background:#fff}
    .yt:hover{background:#fff1f3;border-color:#ffc2cc}
    .yt svg{display:block}
    @media(max-width:520px){.yt span{display:none}}
    main{max-width:1120px;margin:32px auto;padding:0 20px}
    h1{font-size:clamp(26px,4vw,38px);margin:0 0 6px}.lead{color:var(--muted);margin:0 0 24px}
    .card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:24px;box-shadow:0 12px 34px #314b3810}
    .btn{border:0;border-radius:11px;padding:11px 16px;background:var(--green);color:#fff;font:inherit;font-weight:700;cursor:pointer}
    .btn.light{background:var(--mint);color:var(--green)}.btn.orange{background:var(--orange)}
    .btn:disabled{opacity:.5;cursor:not-allowed}

    /* 1. 동물 선택 */
    .pick-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
    .pick{border:2px solid var(--line);border-radius:20px;background:#fff;padding:22px 12px;text-align:center;cursor:pointer;font:inherit;color:var(--ink);transition:transform .15s,border-color .15s}
    .pick:hover{transform:translateY(-4px);border-color:var(--orange)}
    .pick .face{font-size:84px;line-height:1.1;display:block}
    .pick b{display:block;font-size:19px;margin-top:8px}.pick small{color:var(--muted)}

    /* 2. 미용실 */
    .salon{display:grid;grid-template-columns:1.1fr .9fr;gap:20px;align-items:start}
    .stage-wrap{position:relative}
    .stage{position:relative;width:100%;max-width:420px;aspect-ratio:1;margin:0 auto;border-radius:50%;
      background:radial-gradient(circle at 50% 45%,#fffdf8 0,#f1ede3 70%,#e8e2d4 100%);touch-action:none;overflow:hidden;user-select:none;cursor:none}
    .stage.no-tool{cursor:pointer}
    .pet{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:min(150px,34vw);line-height:1;z-index:2;pointer-events:none}
    .tuft{position:absolute;border-radius:50%;z-index:3;transform:translate(-50%,-50%);transition:background .25s;box-shadow:inset -3px -4px 0 #00000014}
    .tuft.fall{animation:fall .9s ease-in forwards;z-index:5}
    @keyframes fall{to{transform:translate(-50%,180px) rotate(160deg);opacity:0}}
    .dirt{position:absolute;border-radius:50%;z-index:4;transform:translate(-50%,-50%);background:radial-gradient(circle,#6e5028cc 0,#6e502888 60%,transparent 72%);pointer-events:none}
    .fx{position:absolute;pointer-events:none;z-index:6;transform:translate(-50%,-50%)}
    .bubble{width:18px;height:18px;border-radius:50%;border:2px solid #9fd6f2;background:#e9f7ffaa;animation:rise 1s ease-out forwards}
    @keyframes rise{to{transform:translate(-50%,-90px) scale(1.6);opacity:0}}
    .heart{font-size:28px;animation:float 1.4s ease-out forwards}
    @keyframes float{to{transform:translate(-50%,-140px) scale(1.4);opacity:0}}
    .spark{font-size:24px;animation:pop .9s ease-out forwards}
    @keyframes pop{0%{transform:translate(-50%,-50%) scale(.3)}60%{transform:translate(-50%,-50%) scale(1.3)}100%{transform:translate(-50%,-50%) scale(1);opacity:0}}
    .cursor{position:absolute;z-index:8;font-size:34px;pointer-events:none;transform:translate(-30%,-70%);display:none}
    .speech{position:absolute;left:50%;top:8%;transform:translateX(-50%);background:#fff;border:2px solid var(--orange);border-radius:16px;padding:8px 14px;font-weight:700;font-size:15px;z-index:9;white-space:nowrap;opacity:0;transition:opacity .2s}
    .speech.show{opacity:1}
    .pet.wiggle{animation:wiggle .9s ease-in-out}
    .pet.jump{animation:jump .9s ease-out}
    .pet.roll{animation:roll 1s ease-in-out}
    .pet.shake{animation:shake .6s linear}
    @keyframes wiggle{0%,100%{transform:translate(-50%,-50%) rotate(0)}20%{transform:translate(-50%,-50%) rotate(-14deg)}40%{transform:translate(-50%,-50%) rotate(12deg)}60%{transform:translate(-50%,-50%) rotate(-10deg)}80%{transform:translate(-50%,-50%) rotate(8deg)}}
    @keyframes jump{0%,100%{transform:translate(-50%,-50%)}35%{transform:translate(-50%,-85%) scale(1.06)}55%{transform:translate(-50%,-50%) scale(1.08,.92)}75%{transform:translate(-50%,-62%)}}
    @keyframes roll{to{transform:translate(-50%,-50%) rotate(360deg)}}
    @keyframes shake{0%,100%{transform:translate(-50%,-50%)}25%{transform:translate(-56%,-50%)}75%{transform:translate(-44%,-50%)}}
    .tip{text-align:center;color:var(--muted);font-size:14px;margin:12px 0 0;min-height:21px}

    .panel h2{margin:0 0 4px;font-size:21px}.panel .sub{color:var(--muted);font-size:14px;margin:0 0 16px}
    .stats{display:grid;gap:10px;margin-bottom:18px}
    .stat{display:grid;grid-template-columns:70px 1fr 44px;align-items:center;gap:8px;font-size:14px}
    .bar{height:12px;border-radius:999px;background:var(--line);overflow:hidden}
    .bar i{display:block;height:100%;border-radius:999px;background:var(--green);transition:width .3s}
    .stat:nth-child(2) .bar i{background:#4ba3d6}.stat:nth-child(3) .bar i{background:var(--orange)}
    .stat span:last-child{text-align:right;font-weight:700}
    .tools{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
    .tool{border:2px solid var(--line);border-radius:14px;background:#fff;padding:10px 4px;font:inherit;font-size:13px;font-weight:700;cursor:pointer;color:var(--ink)}
    .tool .emoji{display:block;font-size:28px}
    .tool.active{border-color:var(--green);background:var(--mint)}
    .palette{display:none;gap:8px;margin-top:12px;flex-wrap:wrap;align-items:center}
    .palette.show{display:flex}
    .swatch{width:32px;height:32px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1px var(--line);cursor:pointer}
    .swatch.active{box-shadow:0 0 0 3px var(--green)}
    .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
    .done{margin-top:14px;padding:12px;border-radius:12px;background:var(--mint);color:var(--green);font-weight:700;text-align:center;display:none}
    .done.show{display:block}

    /* 3. 산책 (달리기) */
    .modal{position:fixed;inset:0;background:#26352dcc;display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
    .modal.show{display:flex}
    .walk{background:#fff;border-radius:20px;padding:18px;width:min(780px,100%)}
    .walk-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
    .walk-head h2{margin:0;font-size:20px}
    .score{font-weight:700;color:var(--green)}
    canvas{width:100%;display:block;border-radius:14px;background:#eaf5fb;touch-action:none;cursor:pointer}
    .walk-foot{display:flex;justify-content:space-between;align-items:center;margin-top:10px;gap:8px;flex-wrap:wrap;font-size:14px;color:var(--muted)}

    @media(max-width:820px){.pick-grid{grid-template-columns:repeat(2,1fr)}.salon{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <header class="top"><div class="brand">두룹 <span>살롱</span></div>
    <div class="top-links">
      <!-- 유튜브: 고른 동물에 맞춰 "○○ 미용" 영상 검색 결과를 새 탭으로 엶 -->
      <a class="yt" id="yt-link" href="https://www.youtube.com/results?search_query=%EB%B0%98%EB%A0%A4%EB%8F%99%EB%AC%BC+%EB%AF%B8%EC%9A%A9" target="_blank" rel="noopener noreferrer" title="유튜브에서 미용 영상 보기" aria-label="유튜브에서 미용 영상 보기">
        <svg viewBox="0 0 28 20" width="26" height="19" aria-hidden="true"><rect width="28" height="20" rx="5" fill="#ff0033"/><path d="M11 5.5v9l8-4.5z" fill="#fff"/></svg>
        <span>미용 영상</span>
      </a>
      <a class="back" href="index.html">← 예약 페이지로</a>
    </div>
  </header>
  <main>
    <!-- 1. 동물 선택 화면 -->
    <section id="pick-screen">
      <h1>미용 체험 게임</h1>
      <p class="lead">미용해 줄 친구를 골라주세요. 털도 깎고, 목욕도 시키고, 예쁘게 염색하고, 산책도 다녀와요!</p>
      <div class="pick-grid" id="pick-grid"></div>
    </section>

    <!-- 2. 미용실 화면 -->
    <section id="salon-screen" hidden>
      <div class="salon">
        <div class="card stage-wrap">
          <div class="stage" id="stage">
            <div class="pet emoji" id="pet"></div>
            <div class="speech" id="speech"></div>
            <div class="cursor emoji" id="cursor"></div>
          </div>
          <p class="tip" id="tip"></p>
        </div>
        <div class="card panel">
          <h2 id="pet-title">-</h2>
          <p class="sub" id="pet-sub">도구를 고른 뒤 동물 위를 문질러 보세요.</p>
          <div class="stats">
            <div class="stat"><span>털 정리</span><div class="bar"><i id="bar-trim"></i></div><span id="val-trim">0%</span></div>
            <div class="stat"><span>청결도</span><div class="bar"><i id="bar-clean"></i></div><span id="val-clean">0%</span></div>
            <div class="stat"><span>기분</span><div class="bar"><i id="bar-mood"></i></div><span id="val-mood">0%</span></div>
          </div>
          <div class="tools">
            <button class="tool" data-tool="clip"><span class="emoji">✂️</span>털 깎기</button>
            <button class="tool" data-tool="bath"><span class="emoji">🛁</span>목욕</button>
            <button class="tool" data-tool="dye"><span class="emoji">🎨</span>염색</button>
            <button class="tool" id="btn-aegyo"><span class="emoji">💕</span>애교 보기</button>
            <button class="tool" id="btn-walk"><span class="emoji">🦮</span>산책 가기</button>
            <button class="tool" data-tool="none"><span class="emoji">✋</span>쓰다듬기</button>
          </div>
          <div class="palette" id="palette"></div>
          <div class="row">
            <button class="btn light" id="btn-regrow">🌱 털 다시 자라기</button>
            <button class="btn light" id="btn-change">🔄 다른 동물</button>
          </div>
          <div class="done" id="done">✨ 완벽한 미용 완료! 정말 멋져졌어요 ✨</div>
        </div>
      </div>
    </section>
  </main>

  <!-- 3. 산책 미니게임 -->
  <div class="modal" id="walk-modal" role="dialog" aria-modal="true" aria-labelledby="walk-title">
    <div class="walk">
      <div class="walk-head">
        <h2 id="walk-title">🦮 산책 달리기</h2>
        <div class="score">점수 <span id="w-score">0</span> · 최고 <span id="w-best">0</span></div>
        <button class="btn light" id="walk-close">산책 끝내기</button>
      </div>
      <canvas id="walk-canvas" width="760" height="260"></canvas>
      <div class="walk-foot">
        <span>스페이스바 · ↑ · 화면 터치로 점프! 장애물을 피하고 🦴 뼈다귀를 모아요.</span>
        <span id="w-state">시작하려면 점프하세요</span>
      </div>
    </div>
  </div>

  <script>
  (function(){
    // ===== 동물 데이터 =====
    const ANIMALS={
      dog:  {name:'강아지',emoji:'🐶',fur:['#e6c79c','#d9b582'],intro:'꼬리 흔드는 귀염둥이',
             lines:['멍멍! 간식 주세요~','꼬리 흔들흔들 🐾','주인님 최고야!','산책 가자 멍!']},
      cat:  {name:'고양이',emoji:'🐱',fur:['#d9d4cc','#c7bfb3'],intro:'새침하지만 다정한 냥이',
             lines:['냥~ 쓰다듬어도 돼','골골골골…','츄르 주면 애교 더 해줄게','오늘은 특별히 안아줄게냥']},
      lion: {name:'사자',emoji:'🦁',fur:['#d98b2b','#c47622'],intro:'갈기가 풍성한 백수의 왕',
             lines:['어흥~ 나도 귀엽지?','갈기 빗어줘서 고마워!','백수의 왕도 애교는 못 참지','으르렁… 아니 그르릉~']},
      tiger:{name:'호랑이',emoji:'🐯',fur:['#f2a03d','#3b2a1a'],intro:'줄무늬가 멋진 숲의 친구',
             lines:['어흥! 줄무늬 멋지지?','뒹굴뒹굴~ 배 만져줘','호랑이도 미용은 좋아해','꼬리 잡기 놀이 할래?']}
    };
    const COLORS=[['원래색',null],['분홍','#ff9ec7'],['하늘','#8fd3ff'],['보라','#b99cff'],['민트','#8de0c0'],['노랑','#ffe27a'],['주황','#ffb26b']];
    const ANIMS=['wiggle','jump','roll'];
    const TOOL_CURSOR={clip:'✂️',bath:'🧽',dye:'🖌️'};
    const TIPS={clip:'✂️ 동물 주변의 덥수룩한 털을 문질러서 깎아주세요.',bath:'🧽 갈색 얼룩을 문질러서 깨끗하게 씻겨주세요.',
                dye:'🖌️ 색을 고르고 털을 문지르면 염색돼요.',none:'✋ 동물을 눌러서 쓰다듬어 주세요. 애교를 부려요!'};

    const $=id=>document.getElementById(id);
    const stage=$('stage'), pet=$('pet'), cursor=$('cursor'), speech=$('speech');
    let animal=null, key=null, tool='clip', dyeColor='#ff9ec7';
    let tufts=[], dirts=[], totalTufts=0, totalDirt=9, mood=40, pointerDown=false, doneShown=false;

    // ===== 1. 동물 선택 =====
    $('pick-grid').innerHTML=Object.entries(ANIMALS).map(([k,a])=>
      `<button class="pick" data-k="${k}"><span class="face emoji">${a.emoji}</span><b>${a.name}</b><small>${a.intro}</small></button>`).join('');
    $('pick-grid').addEventListener('click',e=>{const b=e.target.closest('.pick');if(b)startSalon(b.dataset.k);});

    // 유튜브 링크를 고른 동물의 미용 영상 검색으로 바꿈 (동물 고르기 전엔 "반려동물 미용")
    function setYoutube(name){
      const q=encodeURIComponent((name||'반려동물')+' 미용');
      $('yt-link').href='https://www.youtube.com/results?search_query='+q;
      $('yt-link').title=`유튜브에서 ${name||'반려동물'} 미용 영상 보기`;
    }

    function startSalon(k){
      key=k; animal=ANIMALS[k]; mood=40; doneShown=false;
      setYoutube(animal.name);
      $('pick-screen').hidden=true; $('salon-screen').hidden=false;
      pet.textContent=animal.emoji;
      $('pet-title').textContent=`${animal.emoji} ${animal.name} 미용 중`;
      growFur(); addDirt(9);
      setTool('clip'); updateStats();
      say(animal.lines[0]);
    }

    // ===== 털 / 얼룩 만들기 =====
    function growFur(){
      tufts.forEach(t=>t.el.remove()); tufts=[];
      const n=key==='lion'?46:38;
      for(let i=0;i<n;i++){
        const ring=i%3===0?0.28:0.36;            // 안쪽/바깥쪽 두 겹
        const ang=(i/n)*Math.PI*2+Math.random()*0.25;
        const r=ring+Math.random()*0.06;
        const size=key==='lion'?9+Math.random()*3:7.5+Math.random()*2.5;   // stage 대비 %
        const base=key==='tiger'&&i%4===0?animal.fur[1]:animal.fur[i%5===0?1:0];
        const el=document.createElement('div');
        el.className='tuft';
        Object.assign(el.style,{left:(50+Math.cos(ang)*r*100)+'%',top:(50+Math.sin(ang)*r*100)+'%',width:size+'%',height:size+'%',background:base});
        stage.appendChild(el);
        tufts.push({el,base,dyed:null,alive:true});
      }
      totalTufts=tufts.length; doneShown=false; $('done').classList.remove('show');
      updateStats();
    }
    function addDirt(n){
      for(let i=0;i<n;i++){
        const ang=Math.random()*Math.PI*2, r=Math.random()*0.17;
        const size=7+Math.random()*5;
        const el=document.createElement('div'); el.className='dirt';
        Object.assign(el.style,{left:(50+Math.cos(ang)*r*100)+'%',top:(50+Math.sin(ang)*r*100)+'%',width:size+'%',height:size+'%'});
        stage.appendChild(el);
        dirts.push({el,hp:1});
      }
      doneShown=false; $('done').classList.remove('show');
      updateStats();
    }

    // ===== 도구 =====
    document.querySelectorAll('.tool[data-tool]').forEach(b=>b.addEventListener('click',()=>setTool(b.dataset.tool)));
    function setTool(t){
      tool=t;
      document.querySelectorAll('.tool[data-tool]').forEach(b=>b.classList.toggle('active',b.dataset.tool===t));
      $('palette').classList.toggle('show',t==='dye');
      stage.classList.toggle('no-tool',t==='none');
      cursor.textContent=TOOL_CURSOR[t]||'';
      $('tip').textContent=TIPS[t];
    }
    $('palette').innerHTML=COLORS.map(([n,c],i)=>`<button class="swatch${i===1?' active':''}" title="${n}" data-c="${c||''}" style="background:${c||'linear-gradient(135deg,'+'#e6c79c 50%,#d98b2b 50%)'}"></button>`).join('')
      +'<button class="btn orange" id="dye-all" style="padding:7px 12px;font-size:13px">한 번에 전체 염색</button>';
    $('palette').addEventListener('click',e=>{
      if(e.target.id==='dye-all'){tufts.filter(t=>t.alive).forEach(t=>paint(t));mood=Math.min(100,mood+8);sparkleAt(50,30);updateStats();return;}
      const s=e.target.closest('.swatch');if(!s)return;
      dyeColor=s.dataset.c||null;
      document.querySelectorAll('.swatch').forEach(x=>x.classList.toggle('active',x===s));
    });
    function paint(t){t.dyed=dyeColor;t.el.style.background=dyeColor||t.base;}

    // ===== 문지르기 처리 =====
    function pos(e){const r=stage.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width*100,y:(e.clientY-r.top)/r.height*100,px:e.clientX-r.left,py:e.clientY-r.top};}
    const near=(el,p,rad)=>{const x=parseFloat(el.style.left),y=parseFloat(el.style.top);return Math.hypot(x-p.x,y-p.y)<rad;};

    stage.addEventListener('pointerdown',e=>{pointerDown=true;stage.setPointerCapture(e.pointerId);act(pos(e));
      if(tool==='none')aegyo();});
    stage.addEventListener('pointermove',e=>{const p=pos(e);
      if(TOOL_CURSOR[tool]){cursor.style.display='block';cursor.style.left=p.x+'%';cursor.style.top=p.y+'%';}
      if(pointerDown)act(p);});
    stage.addEventListener('pointerup',()=>pointerDown=false);
    stage.addEventListener('pointercancel',()=>pointerDown=false);
    stage.addEventListener('pointerleave',()=>{cursor.style.display='none';});

    let lastFx=0;
    function act(p){
      if(tool==='clip'){
        let cut=0;
        tufts.forEach(t=>{if(t.alive&&near(t.el,p,7)){t.alive=false;t.el.classList.add('fall');setTimeout(()=>t.el.remove(),900);cut++;}});
        if(cut){mood=Math.min(100,mood+cut);updateStats();}
      }else if(tool==='bath'){
        dirts.forEach(d=>{if(d.hp>0&&near(d.el,p,9)){d.hp-=0.2;d.el.style.opacity=Math.max(d.hp,0);if(d.hp<=0){d.el.remove();sparkleAt(parseFloat(d.el.style.left),parseFloat(d.el.style.top));}}});
        dirts=dirts.filter(d=>d.hp>0);
        const now=performance.now();
        if(now-lastFx>60){lastFx=now;fx('bubble',p.x+(Math.random()*8-4),p.y+(Math.random()*8-4),'');}
        updateStats();
      }else if(tool==='dye'){
        tufts.forEach(t=>{if(t.alive&&near(t.el,p,7))paint(t);});
      }
    }

    function fx(cls,x,y,text){const el=document.createElement('div');el.className='fx '+cls+(text?' emoji':'');el.textContent=text;el.style.left=x+'%';el.style.top=y+'%';stage.appendChild(el);setTimeout(()=>el.remove(),1500);}
    function sparkleAt(x,y){fx('spark',x,y,'✨');}

    // ===== 애교 =====
    $('btn-aegyo').addEventListener('click',aegyo);
    let speechTimer=null;
    function aegyo(){
      const a=ANIMS[Math.floor(Math.random()*ANIMS.length)];
      pet.classList.remove(...ANIMS);void pet.offsetWidth;pet.classList.add(a);
      setTimeout(()=>pet.classList.remove(a),1000);
      for(let i=0;i<5;i++)setTimeout(()=>fx('heart',35+Math.random()*30,45+Math.random()*15,['💕','💖','💗','🐾'][i%4]),i*140);
      say(animal.lines[Math.floor(Math.random()*animal.lines.length)]);
      mood=Math.min(100,mood+6);updateStats();
    }
    function say(text){speech.textContent=text;speech.classList.add('show');clearTimeout(speechTimer);speechTimer=setTimeout(()=>speech.classList.remove('show'),2200);}

    // ===== 상태 =====
    function updateStats(){
      const alive=tufts.filter(t=>t.alive).length;
      const trim=totalTufts?Math.round((1-alive/totalTufts)*100):0;
      const dirtLeft=dirts.reduce((s,d)=>s+Math.max(d.hp,0),0);
      const clean=Math.max(0,Math.round((1-dirtLeft/totalDirt)*100));   // 얼룩 9개 = 0%
      set('trim',trim);set('clean',clean);set('mood',Math.round(mood));
      if(!doneShown&&trim>=70&&clean>=100&&mood>=80){
        doneShown=true;$('done').classList.add('show');
        for(let i=0;i<8;i++)setTimeout(()=>sparkleAt(15+Math.random()*70,15+Math.random()*70),i*120);
        say('고마워요! 완전 멋져졌어요 💖');
      }
    }
    function set(k,v){$('bar-'+k).style.width=v+'%';$('val-'+k).textContent=v+'%';}

    $('btn-regrow').addEventListener('click',()=>{growFur();say('털이 다시 북슬북슬~');});
    $('btn-change').addEventListener('click',()=>{
      setYoutube(null);
      tufts.forEach(t=>t.el.remove());dirts.forEach(d=>d.el.remove());tufts=[];dirts=[];
      $('salon-screen').hidden=true;$('pick-screen').hidden=false;
    });

    // ===== 산책 달리기 게임 =====
    const modal=$('walk-modal'), canvas=$('walk-canvas'), ctx=canvas.getContext('2d');
    const W=canvas.width, H=canvas.height, GROUND=H-34, EMOJI='"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
    const OBST=['🪨','🚧','🪵','🧱'];
    let g=null, raf=null, best=0;
    try{best=+localStorage.getItem('groom-walk-best')||0;}catch(e){}
    $('w-best').textContent=best;

    $('btn-walk').addEventListener('click',()=>{modal.classList.add('show');resetWalk();draw();});
    $('walk-close').addEventListener('click',closeWalk);
    function closeWalk(){
      modal.classList.remove('show');cancelAnimationFrame(raf);raf=null;
      if(g&&g.score>0){
        mood=Math.min(100,mood+Math.min(30,Math.round(g.score/10)));
        addDirt(Math.min(6,1+Math.floor(g.score/80)));   // 산책 다녀오면 조금 더러워져요
        say(`산책 최고! 점수 ${g.score}점 🐾`);
        $('tip').textContent='🧽 산책하고 오니 얼룩이 생겼어요. 목욕시켜 주세요!';
      }
    }
    document.addEventListener('keydown',e=>{
      if(!modal.classList.contains('show'))return;
      if(e.code==='Space'||e.code==='ArrowUp'){e.preventDefault();jump();}
      if(e.code==='Escape')closeWalk();
    });
    canvas.addEventListener('pointerdown',e=>{e.preventDefault();jump();});

    function resetWalk(){
      g={state:'ready',y:GROUND,vy:0,speed:300,dist:0,bones:0,score:0,obs:[],items:[],nextObs:1.2,nextItem:2,t:0,
         clouds:[{x:120,y:40},{x:420,y:70},{x:680,y:35}],trees:[{x:200},{x:560}]};
      $('w-score').textContent=0;$('w-state').textContent='시작하려면 점프하세요';
    }
    function jump(){
      if(!g)return;
      if(g.state==='over'){resetWalk();}
      if(g.state==='ready'){g.state='run';$('w-state').textContent='달리는 중!';last=performance.now();raf=requestAnimationFrame(loop);}
      if(g.y>=GROUND-0.5){g.vy=-760;}
    }
    let last=0;
    function loop(now){
      const dt=Math.min(0.033,(now-last)/1000);last=now;
      update(dt);draw();
      if(g.state==='run')raf=requestAnimationFrame(loop);
    }
    function update(dt){
      g.t+=dt;
      g.speed=Math.min(680,300+g.t*9);
      g.dist+=g.speed*dt;
      g.vy+=2300*dt;g.y=Math.min(GROUND,g.y+g.vy*dt);if(g.y>=GROUND)g.vy=0;
      // 장애물
      g.nextObs-=dt;
      if(g.nextObs<=0){const s=34+Math.random()*12;g.obs.push({x:W+20,s,e:OBST[Math.floor(Math.random()*OBST.length)]});
        g.nextObs=(0.75+Math.random()*1.0)*(380/g.speed)+0.35;}
      // 뼈다귀
      g.nextItem-=dt;
      if(g.nextItem<=0){g.items.push({x:W+20,y:GROUND-70-Math.random()*60});g.nextItem=1.6+Math.random()*2;}
      g.obs.forEach(o=>o.x-=g.speed*dt);g.items.forEach(i=>i.x-=g.speed*dt);
      g.obs=g.obs.filter(o=>o.x>-60);g.items=g.items.filter(i=>i.x>-40&&!i.got);
      g.clouds.forEach(c=>{c.x-=g.speed*0.15*dt;if(c.x<-80)c.x=W+40+Math.random()*80;});
      g.trees.forEach(t=>{t.x-=g.speed*0.5*dt;if(t.x<-60)t.x=W+60+Math.random()*200;});
      // 충돌 (판정 박스는 그림보다 조금 작게)
      const px=70,pw=40,ph=40,py=g.y-ph;
      for(const o of g.obs){
        const ox=o.x+6,ow=o.s-12,oh=o.s-10,oy=GROUND-oh;
        if(px<ox+ow&&px+pw>ox&&py<oy+oh&&py+ph>oy){gameOver();return;}
      }
      for(const i of g.items){
        if(Math.abs(i.x-(px+pw/2))<30&&Math.abs(i.y-(py+ph/2))<34){i.got=true;g.bones++;}
      }
      g.score=Math.floor(g.dist/40)+g.bones*20;
      $('w-score').textContent=g.score;
    }
    function gameOver(){
      g.state='over';
      if(g.score>best){best=g.score;try{localStorage.setItem('groom-walk-best',best);}catch(e){}$('w-best').textContent=best;}
      $('w-state').textContent=`꽈당! ${g.score}점 · 점프하면 다시 시작`;
      draw();
    }
    function emoji(ch,x,y,size,flip){
      ctx.save();ctx.font=`${size}px ${EMOJI}`;ctx.textBaseline='bottom';
      if(flip){ctx.translate(x+size,0);ctx.scale(-1,1);ctx.fillText(ch,0,y);}else ctx.fillText(ch,x,y);
      ctx.restore();
    }
    function draw(){
      if(!g)return;
      // 하늘과 땅
      const sky=ctx.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#dff1fb');sky.addColorStop(1,'#f4fbf6');
      ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);
      g.clouds.forEach(c=>emoji('☁️',c.x,c.y+30,34));
      g.trees.forEach(t=>emoji('🌳',t.x,GROUND+4,54));
      ctx.fillStyle='#bfe0a8';ctx.fillRect(0,GROUND,W,H-GROUND);
      ctx.fillStyle='#a5cf8c';for(let x=-(g.dist%40);x<W;x+=40)ctx.fillRect(x,GROUND+10,18,4);
      // 뼈다귀, 장애물
      g.items.forEach(i=>emoji('🦴',i.x-14,i.y+14,28));
      g.obs.forEach(o=>emoji(o.e,o.x,GROUND+4,o.s));
      // 우리 동물 (달릴 때 통통 튀는 효과)
      const bob=g.state==='run'&&g.y>=GROUND?Math.abs(Math.sin(g.t*14))*4:0;
      emoji(animal?animal.emoji:'🐶',64,g.y+4-bob,48);
      // 안내 문구
      ctx.fillStyle='#26352d';ctx.font='bold 20px Arial,"Malgun Gothic",sans-serif';ctx.textAlign='center';
      if(g.state==='ready')ctx.fillText('점프해서 산책 시작! (스페이스바 / 터치)',W/2,H/2-20);
      if(g.state==='over'){ctx.fillText(`꽈당! ${g.score}점`,W/2,H/2-28);ctx.font='16px Arial,"Malgun Gothic",sans-serif';ctx.fillText('점프하면 다시 시작해요',W/2,H/2);}
      ctx.textAlign='left';
    }
  })();
  </script>
</body>
