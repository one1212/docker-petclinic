# 두룹 살롱 펫클리닉 — 도커 컴포즈로 3계층 한 번에 실행
#
#   실행 (처음 / 코드 수정 후):  docker compose up -d --build
#   상태 확인:                   docker compose ps
#   로그 보기:                   docker compose logs -f tomcat-backend
#   끄기 (데이터 유지):          docker compose down
#   DB까지 완전 초기화:          docker compose down -v   (schema.sql / data.sql 을 고쳤을 때)
#
# 브라우저: http://localhost:8088
#
# 비밀번호는 이 파일에 적지 않음. 같은 폴더의 .env (git 제외) 에 넣고 실행:
#   Copy-Item .env.example .env   → .env 의 값을 채운 뒤 docker compose up -d --build
#   (값이 비어 있으면 compose 가 바로 오류를 내고 멈춤)

name: petclinic

services:
  # ===== DB 계층: MySQL 8.4 =====
  db:
    build: ./db-backend
    image: db-backend
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?.env 에 DB_ROOT_PASSWORD 를 지정하세요}
      MYSQL_DATABASE: petclinic
      MYSQL_USER: petclinic
      MYSQL_PASSWORD: ${DB_APP_PASSWORD:?.env 에 DB_APP_PASSWORD 를 지정하세요}
    volumes:
      - db-data:/var/lib/mysql          # 예약 데이터 보관 (down 해도 유지, down -v 하면 삭제)
    healthcheck:
      # 초기화 중 임시 서버는 TCP를 안 열기 때문에, TCP(127.0.0.1)로 응답하면 진짜 준비 완료
      # $$ = compose 가 치환하지 않고 컨테이너 안의 환경변수를 그대로 씀
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    restart: unless-stopped

  # ===== WAS 계층: Tomcat 9 + OpenJDK 21 =====
  tomcat-backend:                       # 이 이름을 WEB(Apache) 프록시가 찾아감 — 바꾸지 말 것
    build: ./tomcat-backend
    image: tomcat-backend
    environment:
      DB_HOST: db
      DB_PASSWORD: ${DB_APP_PASSWORD:?.env 에 DB_APP_PASSWORD 를 지정하세요}
    depends_on:
      db:
        condition: service_healthy      # DB 준비가 끝난 뒤에 시작 → "DB 연결 끊김" 방지
        restart: true                   # DB 컨테이너가 다시 만들어지면 WAS도 같이 재시작
    healthcheck:
      # 이미지 크기를 줄이려고 curl 을 뺐으므로 alpine 기본(busybox) wget 사용
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/petclinic/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  # ===== WEB 계층: Apache 2.4 =====
  web:
    build: ./apache-backend
    image: apache-backend
    ports:
      - "8088:8080"                     # 내 PC 8088 → Apache 8080 (non-root 라 80 대신 8080, 포트 바꾸려면 앞 숫자만 수정)
    environment:
      # 관리자 계정: 값은 여기 적지 않고 실행하는 셸의 환경변수(또는 .env 파일)에서 가져옴
      # 비어 있으면 관리자 화면 · 관리자 API 는 모두 잠김(401)
      ADMIN_USER: ${ADMIN_USER:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_PATH: ${ADMIN_PATH:-/staff-room}
    depends_on:
      - tomcat-backend
    restart: unless-stopped

volumes:
  db-data:
