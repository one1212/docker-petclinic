# 스토리지: EBS gp3 StorageClass (직접 생성)
# EKS 에 설치한 aws-ebs-csi-driver 추가 기능이 PVC 요청을 받아 EBS 볼륨(PV)을 자동으로 만든다.
#   PVC(5Gi 요청) → StorageClass(gp3) → EBS CSI 가 EBS 볼륨 생성 → PV 로 등록 → 파드에 연결
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: gp3
provisioner: ebs.csi.aws.com
parameters:
  type: gp3            # 범용 SSD, gp2 보다 싸고 기본 3000 IOPS
  fsType: ext4
  encrypted: "true"    # EBS 볼륨 암호화 (AWS 관리 키)
# 파드가 어느 노드(AZ)에 뜰지 정해진 뒤에 볼륨을 만든다.
#   EBS 는 한 AZ 에만 존재 → 먼저 만들면 파드와 다른 AZ 에 생겨 붙지 못할 수 있음
volumeBindingMode: WaitForFirstConsumer
# PVC 를 지우면 EBS 볼륨도 같이 삭제 (실습 후 남는 볼륨 요금 방지)
#   운영이라면 Retain 으로 두고 직접 정리
reclaimPolicy: Delete
allowVolumeExpansion: true   # PVC 용량을 늘리면 볼륨도 늘어남
