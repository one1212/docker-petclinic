# 공통 설정 (비밀 아님). 비밀번호는 Secret(petclinic-secret)으로 따로 만든다.
apiVersion: v1
kind: Namespace
metadata:
  name: petclinic
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: petclinic-config
  namespace: petclinic
data:
  TZ: Asia/Seoul
  DB_HOST: db              # DB Service 이름
  DB_PORT: "3306"
  DB_NAME: petclinic
  DB_USER: petclinic
  TOMCAT_HOST: tomcat-backend   # WAS Service 이름 (Apache 프록시가 찾아감)
  TOMCAT_PORT: "8080"
  ADMIN_PATH: /staff-room
